<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" type="image/x-icon" href="https://www.nastripack.com.br/favicon.ico">
<link rel="shortcut icon" href="https://www.nastripack.com.br/favicon.ico">
<link rel="apple-touch-icon" href="https://www.nastripack.com.br/favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nastripack — Portal B2B</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0A0C11;
  --bg-card:#12151C;
  --bg-card-light:#1A1E28;
  --border:#252A36;
  --border-light:#2D3344;
  --text:#F1F3F9;
  --text-muted:#6B7A99;
  --text-soft:#A8B3CC;
  --blue:#2563EB;
  --blue-dark:#1D4ED8;
  --blue-bright:#60A5FA;
  --blue-bg:rgba(37,99,235,0.12);
  --blue-glow:rgba(37,99,235,0.25);
  --green:#10B981;
  --red:#EF4444;
  --yellow:#FBBF24;
  --gradient:linear-gradient(135deg,#2563EB,#1D4ED8,#06B6D4);
  --shadow-blue:0 20px 60px rgba(37,99,235,0.3);
}

*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{height:100%}

body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  width:100%;height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* BACKGROUND */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 0%,rgba(37,99,235,0.18),transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%,rgba(6,182,212,0.12),transparent 60%);
  z-index:0;pointer-events:none;
}

/* GRID LINES */
body::after{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(37,99,235,0.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(37,99,235,0.04) 1px,transparent 1px);
  background-size:48px 48px;
  z-index:0;pointer-events:none;
}

/* FLOATING ORBS */
.orb{
  position:fixed;border-radius:50%;
  filter:blur(80px);pointer-events:none;z-index:0;
  animation:orbFloat 8s ease-in-out infinite;
}
.orb-1{
  width:400px;height:400px;
  background:radial-gradient(circle,rgba(37,99,235,0.15),transparent 70%);
  top:-100px;left:-100px;
  animation-delay:0s;
}
.orb-2{
  width:350px;height:350px;
  background:radial-gradient(circle,rgba(6,182,212,0.10),transparent 70%);
  bottom:-80px;right:-80px;
  animation-delay:-4s;
}
@keyframes orbFloat{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(30px,-30px)}
}

/* MAIN WRAPPER */
.wrapper{
  position:relative;z-index:10;
  width:100%;
  max-width:min(420px, 92vw);
  padding:clamp(8px,2vw,20px);
  animation:fadeUp .6s cubic-bezier(.34,1.56,.64,1);
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}

/* LOGO AREA */
.logo-area{
  text-align:center;
  margin-bottom:16px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.logo-img{
  height:72px;width:auto;
  filter:drop-shadow(0 4px 20px rgba(37,99,235,0.4));
}
.portal-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,rgba(37,99,235,0.15),rgba(6,182,212,0.08));
  border:1px solid rgba(96,165,250,0.3);
  color:var(--blue-bright);
  font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  padding:6px 16px;border-radius:30px;
  position:relative;overflow:hidden;
}
.portal-badge::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(96,165,250,0.2),transparent);
  animation:shimmer 3s infinite;
}
@keyframes shimmer{0%{left:-100%}100%{left:200%}}
.badge-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:pulseDot 2s infinite;
}
@keyframes pulseDot{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.6;transform:scale(.8)}
}

/* CARD */
.card{
  background:linear-gradient(145deg,rgba(18,21,28,0.95),rgba(26,30,40,0.95));
  border:1px solid rgba(96,165,250,0.25);
  border-radius:clamp(12px,2vw,20px);
  width:100%;
  padding:clamp(12px,2vh,20px) clamp(14px,2.5vw,24px);
  backdrop-filter:blur(20px);
  box-shadow:
    0 32px 80px rgba(0,0,0,0.6),
    0 0 0 1px rgba(255,255,255,0.06),
    0 0 24px rgba(37,99,235,0.12),
    inset 0 1px 0 rgba(255,255,255,0.08);
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;
  top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(96,165,250,0.5),rgba(6,182,212,0.3),transparent);
}

.card-title{
  font-size:22px;font-weight:800;
  color:var(--text);letter-spacing:-.5px;
  margin-bottom:6px;
  text-align:center;
}
.card-subtitle{
  font-size:13px;color:var(--text-muted);
  margin-bottom:20px;font-weight:400;line-height:1.5;
  text-align:center;
}

/* FORM */
.campo{margin-bottom:clamp(6px,1vh,10px)}
.campo label{
  display:flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:1px;color:var(--text-muted);
  margin-bottom:8px;
}
.campo label .lc{width:13px;height:13px;stroke:var(--text-muted)}

.input-wrap{position:relative}
.input-wrap input{
  width:100%;max-width:100%;padding:clamp(8px,1.2vh,11px) 16px clamp(8px,1.2vh,11px) 40px;
  background:rgba(10,12,17,0.8);
  border:1px solid var(--border);
  border-radius:10px;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:14px;color:var(--text);
  outline:none;
  transition:all .25s;
}
.input-wrap input::placeholder{color:var(--text-muted)}
.input-wrap input:focus{
  border-color:var(--blue);
  background:rgba(37,99,235,0.05);
  box-shadow:0 0 0 3px var(--blue-bg);
}
.input-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  pointer-events:none;
}
.input-icon .lc{width:16px;height:16px;stroke:var(--text-muted)}
.input-wrap input:focus ~ .input-icon .lc,
.input-wrap:focus-within .input-icon .lc{stroke:var(--blue-bright)}

/* TOGGLE SENHA */
.toggle-senha{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;padding:4px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);transition:color .2s;
}
.toggle-senha:hover{color:var(--blue-bright)}
.toggle-senha .lc{width:16px;height:16px;stroke:currentColor}

/* ESQUECI SENHA */
.forgot{
  display:block;text-align:right;
  font-size:11px;color:var(--text-muted);
  text-decoration:none;margin-top:4px;
  transition:color .2s;font-weight:500;
}
.forgot:hover{color:var(--blue-bright)}

/* BTN ENTRAR */
.btn-entrar{
  width:100%;max-width:100%;padding:15px;margin-top:24px;
  background:var(--gradient);
  border:none;border-radius:10px;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:14px;font-weight:800;
  color:#fff;cursor:pointer;
  letter-spacing:.5px;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;
  box-shadow:0 8px 24px rgba(37,99,235,.4),inset 0 1px 0 rgba(255,255,255,.15);
}
.btn-entrar::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
  transition:left .6s;
}
.btn-entrar:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 40px rgba(37,99,235,.55),inset 0 1px 0 rgba(255,255,255,.2);
}
.btn-entrar:hover::before{left:100%}
.btn-entrar:active{transform:translateY(0)}
.btn-entrar:disabled{
  opacity:.6;cursor:not-allowed;transform:none;
}
.btn-entrar .lc{width:18px;height:18px;stroke:#fff}

/* DIVIDER */
.divider{
  display:flex;align-items:center;gap:12px;
  margin:10px 0;
}
.divider span{font-size:11px;color:var(--text-muted);white-space:nowrap;font-weight:500}
.divider::before,.divider::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--border),transparent);
}

/* INFO BOX */
.info-box{
  background:linear-gradient(135deg,rgba(37,99,235,0.08),rgba(6,182,212,0.04));
  border:1px solid rgba(37,99,235,0.2);
  border-radius:10px;
  padding:8px 12px;
  display:flex;align-items:flex-start;gap:8px;
  font-size:11px;color:var(--text-soft);line-height:1.5;
}
.info-box .lc{width:16px;height:16px;stroke:var(--blue-bright);flex-shrink:0;margin-top:1px}

/* ERROR */
.error-msg{
  display:none;
  background:rgba(239,68,68,0.08);
  border:1px solid rgba(239,68,68,0.25);
  border-radius:8px;padding:10px 14px;
  font-size:12px;color:var(--red);
  margin-top:16px;
  align-items:center;gap:8px;
}
.error-msg.show{display:flex}
.error-msg .lc{width:14px;height:14px;stroke:var(--red);flex-shrink:0}

/* FOOTER */


/* LOADER */
.btn-loader{display:none}
.btn-loader.show{display:flex;align-items:center;gap:8px}
.spinning{animation:spin 1s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* RESPONSIVE */
/* Landscape mobile */
@media(max-height:600px){
  .wrapper{max-width:min(380px,92vw)}
  .logo-area{margin-bottom:8px!important}
  .info-box{display:none}
}
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="wrapper">

  <!-- CARD LOGIN -->
  <div class="card">
    <div style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:3px;color:var(--blue-bright);text-align:center;margin-bottom:8px;text-shadow:0 0 20px rgba(96,165,250,.4)">Portal B2B</div>
    <div style="text-align:center;margin-bottom:12px">
      <img src="https://i.postimg.cc/L5XDXMBp/logo-nastripack-atacadista.png" 
           style="height:clamp(52px,7vh,74px);width:auto;filter:drop-shadow(0 4px 16px rgba(37,99,235,.35))" 
           alt="Nastripack Atacadista">
    </div>

    <!-- EMAIL -->
    <div class="campo">
      <label>
        <i data-lucide="mail" class="lc"></i>
        E-mail corporativo
      </label>
      <div class="input-wrap">
        <input type="email" id="email" placeholder="seu@empresa.com.br" autocomplete="email">
        <span class="input-icon"><i data-lucide="mail" class="lc"></i></span>
      </div>
    </div>

    <!-- SENHA -->
    <div class="campo">
      <label>
        <i data-lucide="lock" class="lc"></i>
        Senha
      </label>
      <div class="input-wrap">
        <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
        <span class="input-icon"><i data-lucide="lock" class="lc"></i></span>
        <button class="toggle-senha" onclick="toggleSenha()" type="button" id="toggle-btn">
          <i data-lucide="eye" class="lc" id="eye-icon"></i>
        </button>
      </div>
      <a href="#" class="forgot">Esqueceu a senha?</a>
    </div>

    <!-- ERRO -->
    <div class="error-msg" id="error-msg">
      <i data-lucide="alert-circle" class="lc"></i>
      <span id="error-text">E-mail ou senha incorretos.</span>
    </div>

    <!-- BTN ENTRAR -->
    <button class="btn-entrar" id="btn-entrar" onclick="fazerLogin()">
      <span id="btn-label">
        <i data-lucide="log-in" class="lc"></i>
        Entrar no portal
      </span>
    </button>

    <div class="divider"><span>acesso restrito</span></div>

    <!-- INFO -->
    <div class="info-box">
      <i data-lucide="shield-check" class="lc"></i>
      <span>O acesso ao Portal B2B da Nastripack é exclusivo para clientes cadastrados. Para solicitar acesso, escaneie o QR Code abaixo ou entre em contato com nossa equipe comercial.</span>
    </div>
  
    <!-- QR CODE WHATSAPP -->
    <div style="text-align:center;margin-top:10px">
      <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:6px">
        Solicitar acesso via WhatsApp
      </div>
      <a href="https://wa.me/5511914134471" target="_blank" style="display:inline-block;text-decoration:none">
        <div style="background:#fff;padding:12px;border-radius:12px;display:inline-block;box-shadow:0 4px 20px rgba(37,99,235,.25)">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=https://wa.me/5511914134471&color=000000&bgcolor=ffffff&margin=0" 
               width="80" height="80" style="display:block;border-radius:4px;max-width:100%" alt="QR Code WhatsApp Nastripack"
               style="display:block;border-radius:4px">
        </div>

      </a>
    </div>

  </div>



</div>

<script>
// ── SUPABASE ─────────────────────────────────────────────────────────────
const { createClient } = supabase;
const sb = createClient(
  'https://ejparzvdyokntveaxphq.supabase.co',
  'sb_publishable_4Xbg7pAZ8D5tBRmvLQCMiA_0n5ibVGD'
);

function toggleSenha(){
  const input = document.getElementById('senha');
  const icon  = document.getElementById('eye-icon');
  if(input.type === 'password'){
    input.type = 'text';
    icon.setAttribute('data-lucide','eye-off');
  }else{
    input.type = 'password';
    icon.setAttribute('data-lucide','eye');
  }
  lucide.createIcons();
}

async function fazerLogin(){
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const btn   = document.getElementById('btn-entrar');
  const label = document.getElementById('btn-label');

  document.getElementById('error-msg').classList.remove('show');

  if(!email){
    mostrarErro('Por favor, informe seu e-mail.');
    document.getElementById('email').focus();
    return;
  }
  if(!senha){
    mostrarErro('Por favor, informe sua senha.');
    document.getElementById('senha').focus();
    return;
  }

  // Loading
  btn.disabled = true;
  label.innerHTML = '<i data-lucide="loader" class="lc spinning"></i> Entrando...';
  lucide.createIcons();

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });

    if(error){
      let msg = 'E-mail ou senha incorretos.';
      if(error.message.includes('Email not confirmed')) msg = 'E-mail ainda não confirmado. Verifique sua caixa de entrada.';
      if(error.message.includes('Invalid login')) msg = 'E-mail ou senha incorretos. Verifique suas credenciais.';
      mostrarErro(msg);
      btn.disabled = false;
      label.innerHTML = '<i data-lucide="log-in" class="lc"></i> Entrar no portal';
      lucide.createIcons();
      return;
    }

    // Sucesso!
    label.innerHTML = '<i data-lucide="check-circle" class="lc"></i> Acesso liberado!';
    lucide.createIcons();

    // Salvar sessão e redirecionar
    setTimeout(() => {
      window.location.href = 'catalogo.html';
    }, 1000);

  } catch(err) {
    mostrarErro('Erro de conexão. Tente novamente.');
    btn.disabled = false;
    label.innerHTML = '<i data-lucide="log-in" class="lc"></i> Entrar no portal';
    lucide.createIcons();
  }
}

function mostrarErro(msg){
  const erro = document.getElementById('error-msg');
  document.getElementById('error-text').textContent = msg;
  erro.classList.add('show');
}

// Verificar se já está logado
sb.auth.getSession().then(({ data }) => {
  if(data.session) window.location.href = 'catalogo.html';
});

// Enter para logar
document.addEventListener('keydown', e => {
  if(e.key === 'Enter') fazerLogin();
});

lucide.createIcons();
</script>
</body>
</html>
